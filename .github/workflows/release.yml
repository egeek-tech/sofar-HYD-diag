name: Release

# sofar-HYD-diag release pipeline: release-please + binaries + container image +
# provenance attestations. Two-stage flow mirroring egeek-tech/screws-box, adapted
# for the org-enforced "Immutable releases" setting: assets cannot be attached to
# a published release, so release-please cuts the release as a draft and the last
# job publishes it once every asset is in place.
#
# Stage 1 (job `release-please`): on every push to master, release-please scans
# Conventional Commits since the last release and either opens/updates a
# "Release PR", or — when that Release PR is merged — updates CHANGELOG.md and
# .release-please-manifest.json, pushes the vX.Y.Z tag and creates the GitHub
# Release as a draft. force-tag-creation (release-please-config.json) pushes the
# tag up front: GitHub would otherwise create a draft's tag only on publish.
#
# Stage 2 (jobs `build` -> `docker` -> `publish`): only when stage 1 cut a release
# in this run. Cross-compile and attest the linux/amd64 + linux/arm64 binaries at
# the new tag, attach the tarballs to the draft, build/push/attest the multi-arch
# ghcr image from the same binaries, then publish the draft. A failed stage 2
# leaves an unpublished draft that "Re-run failed jobs" can finish.
#
# GitHub App token: release-please authenticates as a GitHub App (org secrets
# RELEASE_BOT_APP_CLIENT_ID / RELEASE_BOT_APP_PRIVATE_KEY) so its Release PR
# triggers pr.yml. A PR opened with the default GITHUB_TOKEN does NOT trigger
# pull_request workflows (GitHub anti-loop guard), so the required lint / test /
# build checks would never run and the master ruleset would block the Release PR
# forever. Stage 2 needs no App token.

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tag + create release + commit CHANGELOG/manifest
      pull-requests: write # open/update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a short-lived token from the release-bot GitHub App so the Release PR
      # triggers pr.yml (default GITHUB_TOKEN would not — anti-loop guard).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the draft release
      id-token: write # OIDC for keyless (Sigstore) signing of the attestation
      attestations: write
    steps:
      - name: Check out at the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o "dist/server-$arch" ./cmd/server
            tar -C dist -czf "dist/sofar-hyd-diag-$VERSION-linux-$arch.tar.gz" "server-$arch"
          done

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/server-amd64
            dist/server-arm64

      # Still a draft, so assets can be attached. --clobber keeps a re-run idempotent.
      - name: Attach tarballs to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/sofar-hyd-diag-*.tar.gz --clobber

      - name: Hand binaries off to docker job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            dist/server-amd64
            dist/server-arm64
          retention-days: 1
          if-no-files-found: error

  docker:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image to ghcr
      id-token: write # OIDC for keyless (Sigstore) signing of the attestation
      attestations: write
    steps:
      - name: Check out at the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/

      # COPY-only Dockerfile, no RUN — no QEMU emulation needed
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/sofar-hyd-diag
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sofar-hyd-diag
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Last: publishing is what makes the release (tag + tarballs) immutable.
  publish:
    needs: [release-please, build, docker]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest
